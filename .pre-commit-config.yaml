repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [ --fix ]

  - repo: https://github.com
    rev: v6.0.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com
    rev: 25.1.0
    hooks:
      - id: black