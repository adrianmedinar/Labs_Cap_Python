name: CI

# Dispara en cada push/PR a main y develop, y semanalmente los lunes a las
# 06:00 UTC para detectar CVEs nuevos sobre dependencias ya fijadas (nadie
# tocó el código, pero pudo publicarse una vulnerabilidad esta semana).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check src tests

      - name: ruff format --check
        run: ruff format --check src tests

  # -------------------------------------------------------------------------
  typecheck:
    name: Tipado estático (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: mypy
        run: mypy src

  # -------------------------------------------------------------------------
  test:
    name: Pruebas (unit/integration/contract/e2e) + cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -e ".[dev]"
          # Ver docs/audit/README.md: pin necesario por incompatibilidad
          # conocida entre passlib 1.7.4 y bcrypt>=4.1.
          pip install "bcrypt>=4.0.1,<4.1.0" --force-reinstall

      - name: Ejecutar suite completa con cobertura
        run: pytest --cov-report=xml --cov-report=term-missing

      - name: Publicar reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Publicar resultados de pruebas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            coverage.xml
          retention-days: 30

  # -------------------------------------------------------------------------
  dependency-audit:
    name: Auditoría de dependencias (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ejecutar pip-audit (falla el build si hay vulnerabilidades)
        run: |
          pip-audit --desc -f json -o pip-audit-report.json
          pip-audit --desc

      - name: Publicar reporte de auditoría como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 90

  # -------------------------------------------------------------------------
  migration-check:
    name: Verificar migraciones Alembic (upgrade/downgrade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Aplicar todas las migraciones (upgrade head)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./ci_migration_check.db"
          JWT_SECRET_KEY: "ci-only-secret-not-for-production-use-1234"
        run: alembic upgrade head

      - name: Revertir todas las migraciones (downgrade base)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./ci_migration_check.db"
          JWT_SECRET_KEY: "ci-only-secret-not-for-production-use-1234"
        run: alembic downgrade base

      - name: Re-aplicar (upgrade head) para confirmar reversibilidad
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./ci_migration_check.db"
          JWT_SECRET_KEY: "ci-only-secret-not-for-production-use-1234"
        run: alembic upgrade head

  # -------------------------------------------------------------------------
  build:
    name: Build (paquete + imagen Docker)
    needs: [lint, typecheck, test, dependency-audit, migration-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Construir paquete (sdist + wheel)
        run: |
          pip install --upgrade build
          python -m build

      - name: Publicar artefactos del paquete
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          retention-days: 30

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: purchase-orders-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  publish-image:
    name: Publicar imagen en GHCR (solo en main)
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
