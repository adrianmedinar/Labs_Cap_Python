[project]
name = "purchase-orders-api"
version = "1.0.0"
description = "API de Órdenes de Compra construida con Arquitectura Hexagonal (Ports & Adapters)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Equipo de Plataforma" }]

dependencies = [
    "fastapi>=0.139.2,<0.140.0",
    "starlette>=1.3.1,<2.0.0",  # pin explícito: corrige PYSEC-2026-161/248/249/1941/1942/2280/2281
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.32,<3.0.0",
    "asyncpg>=0.29.0,<0.30.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "alembic>=1.13.2,<2.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.0.1,<4.1.0",  # pin: passlib 1.7.4 es incompatible con bcrypt>=4.1 (ver README)
    "python-multipart>=0.0.9,<0.1.0",
    "email-validator>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",  # pin mínimo: corrige PYSEC-2026-1845
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "httpx>=0.27.0,<0.28.0",
    "ruff>=0.6.2,<0.7.0",
    "mypy>=1.11.1,<2.0.0",
    "pip-audit>=2.7.3,<3.0.0",
    "factory-boy>=3.3.0,<4.0.0",
    "faker>=27.0.0,<28.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff: lint + formato
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort (orden de imports)
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "ASYNC",         # buenas prácticas async
]
ignore = ["B008"]  # FastAPI usa Depends() como default de argumento, es idiomático

[tool.ruff.lint.isort]
known-first-party = ["purchase_orders"]

# ---------------------------------------------------------------------------
# mypy: tipado estático
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=purchase_orders --cov-report=term-missing --cov-report=xml"
markers = [
    "unit: pruebas unitarias de dominio/aplicación (sin IO)",
    "integration: pruebas de integración (con base de datos real)",
    "contract: pruebas de contrato de la API (schemas/HTTP)",
    "e2e: pruebas end-to-end sobre la API completa",
]

[tool.coverage.run]
source = ["src/purchase_orders"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
